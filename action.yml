name: DirectiveGuard AI Repository Scan
description: Scan repositories for unsafe AI-agent instructions, MCP configuration, and workflows
author: Matthew Searce
branding:
  icon: shield
  color: blue
inputs:
  path:
    description: Repository path to scan
    default: /github/workspace
  format:
    description: Output format (text, json, or sarif)
    default: text
  fail-on:
    description: Minimum severity that fails the check
    default: high
  cloud-url:
    description: Optional DirectiveGuard Cloud base URL for scan history
    default: ""
  api-key:
    description: DirectiveGuard Cloud project API key
    required: false
runs:
  using: docker
  image: Dockerfile
  args:
    - --format
    - ${{ inputs.format }}
    - --fail-on
    - ${{ inputs.fail-on }}
    - --upload
    - ${{ inputs.cloud-url }}
    - ${{ inputs.path }}
